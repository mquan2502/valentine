<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine Letter 💌</title>
  <style>
    :root{
      --paper:#fffdf8;
      --ink:#3a2a2a;
      --accent:#ff4d6d;
      --shadow: 0 18px 55px rgba(0,0,0,.22);
      --radius: 18px;

      /* layout */
      --pad: 18px;

      /* normal (same as top corner cards) */
      --slotW: min(18vw, 220px);
      --slotH: min(13vw, 155px);

      /* tall ONLY for near-envelope (lm/rm) */
      --tallW: min(18vw, 220px);
      --tallH: min(30vw, 420px);

      /* distance from center for near-envelope tall photos */
      --gapFromEnvelope: clamp(185px, 22vw, 320px);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: var(--ink);
      min-height:100svh;
      overflow:hidden;
      background:#0b0b10;
    }

    /* ====== BACKGROUND ====== */
/* ====== BACKGROUND (fixed romantic pink) ====== */
    .stage{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background: radial-gradient(900px 600px at 50% 35%,
        #ffe9f0 0%,
        #ffd3e2 45%,
        #f7b8cf 100%
    );
    }
    /* tắt nền ảnh động */
    .stage .layer{ display:none; }

    .stage::before{
    content:""; position:absolute; inset:0;
    background: rgba(255,255,255,.22);
    pointer-events:none; z-index:2;
    }
    .stage::after{
    content:""; position:absolute; inset:0;
    background: radial-gradient(1200px 700px at 50% 45%,
        transparent 30%,
        rgba(0,0,0,.22) 92%
    );
    pointer-events:none; z-index:3;
    }

    /* hint */
    .tap-hint{
      position:fixed;
      left:50%; top:19%;
      transform:translateX(-50%);
      z-index:20;
      text-align:center;
      color:#fff;
      opacity:.92;
      padding: 10px 14px;
      border-radius:999px;
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(255,255,255,.18);
      font-size:14px;
      letter-spacing:.2px;
      user-select:none;
      max-width: 92vw;
    }

    /* ====== PHOTO FRAME SLOTS ====== */
    .slots{
      position:fixed; inset:0;
      z-index:4;
      pointer-events:none;
    }

    .slot{
      position:absolute;
      width: var(--slotW);
      height: var(--slotH);
      border-radius:18px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 18px 55px rgba(0,0,0,.25);
      overflow:hidden;
      opacity:0;
      transform: scale(.92) translateY(10px);
      transition: opacity 450ms ease, transform 450ms cubic-bezier(.2,.9,.2,1);
      backdrop-filter: blur(4px);
      --photo:none;
    }
    .slot::before{
      content:"";
      position:absolute; inset:0;
      background-image: var(--photo);
      background-size: cover;
      background-position: center;
      filter: saturate(1.05);
    }
    .slot.show{
      opacity:1;
      transform: scale(1) translateY(0);
    }

    /* tall ONLY for lm/rm */
    .slot.tall{
      width: var(--tallW);
      height: var(--tallH);
      transform: scale(.92);
    }
    .slot.tall.show{
      opacity:1;
      transform: scale(1);
    }

    /* TOP 5 */
    .slot.t1{ top: var(--pad); left: var(--pad); }
    .slot.t2{ top: var(--pad); left: 25%; transform: translateX(-50%) scale(.92) translateY(10px); }
    .slot.t2.show{ transform: translateX(-50%) scale(1) translateY(0); }
    .slot.t3{ top: var(--pad); left: 50%; transform: translateX(-50%) scale(.92) translateY(10px); }
    .slot.t3.show{ transform: translateX(-50%) scale(1) translateY(0); }
    .slot.t4{ top: var(--pad); left: 75%; transform: translateX(-50%) scale(.92) translateY(10px); }
    .slot.t4.show{ transform: translateX(-50%) scale(1) translateY(0); }
    .slot.t5{ top: var(--pad); right: var(--pad); }

    /* BOTTOM 5 */
    .slot.b1{ bottom: var(--pad); left: var(--pad); }
    .slot.b2{ bottom: var(--pad); left: 25%; transform: translateX(-50%) scale(.92) translateY(10px); }
    .slot.b2.show{ transform: translateX(-50%) scale(1) translateY(0); }
    .slot.b3{ bottom: var(--pad); left: 50%; transform: translateX(-50%) scale(.92) translateY(10px); }
    .slot.b3.show{ transform: translateX(-50%) scale(1) translateY(0); }
    .slot.b4{ bottom: var(--pad); left: 75%; transform: translateX(-50%) scale(.92) translateY(10px); }
    .slot.b4.show{ transform: translateX(-50%) scale(1) translateY(0); }
    .slot.b5{ bottom: var(--pad); right: var(--pad); }

    /* SIDE EDGES: now NORMAL size like top corners */
    .slot.l1{ top: 36%; left: var(--pad); height: min(18vw, 220px); transform: translateY(-50%) scale(.92) translateY(10px); }
    .slot.l1.show{ transform: translateY(-50%) scale(1) translateY(0); }
    .slot.l2{ top: 64%; left: var(--pad); height: min(18vw, 220px); transform: translateY(-50%) scale(.92) translateY(10px); }
    .slot.l2.show{ transform: translateY(-50%) scale(1) translateY(0); }

    .slot.r1{ top: 36%; right: var(--pad); height: min(18vw, 220px); transform: translateY(-50%) scale(.92) translateY(10px); }
    .slot.r1.show{ transform: translateY(-50%) scale(1) translateY(0); }
    .slot.r2{ top: 64%; right: var(--pad); height: min(18vw, 220px); transform: translateY(-50%) scale(.92) translateY(10px); }
    .slot.r2.show{ transform: translateY(-50%) scale(1) translateY(0); }

    /* NEAR ENVELOPE (2 tall) */
    /* NEAR ENVELOPE (tall only) - align with columns 25% and 75% */
    .slot.lm{
    top: 50%;
    left: 25%;
    transform: translate(-50%,-50%) scale(.92);
    }
    .slot.lm.show{ transform: translate(-50%,-50%) scale(1); }

    .slot.rm{
    top: 50%;
    left: 75%;
    transform: translate(-50%,-50%) scale(.92);
    }
    .slot.rm.show{ transform: translate(-50%,-50%) scale(1); }

    /* mobile adjustments */
    @media (max-width: 520px){
      :root{
        --pad: 12px;
        --slotW: 28vw;
        --slotH: 20vw;
        --tallW: 22vw;
        --tallH: 38vw;
        --gapFromEnvelope: 165px;
      }
      .tap-hint{ top: 8%; font-size:13px; }
    }

    /* ====== CENTER WRAP ====== */
    .wrap{
      position:relative;
      z-index:10;
      width:100%;
      min-height:100svh;
      display:grid;
      place-items:center;
      padding: 22px 0;
    }

    /* ====== ENVELOPE ====== */
    .envelope{
      position:relative;
      width: 560px;            /* <-- wider */
      max-width: 94vw;
      height: 480px;           /* <-- a bit taller to match */
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,228,236,.95));
      box-shadow: var(--shadow);
      user-select:none;
      transform: translateZ(0);
      transition: transform 120ms ease, filter 200ms ease;
    }
    .envelope.locked{ filter: grayscale(.1) brightness(.98); }
    .envelope:active{ transform: scale(.995); }
    .envelope::before{
      content:"";
      position:absolute; inset:10px;
      border-radius: calc(var(--radius) - 10px);
      border: 2px dashed rgba(255,77,109,.30);
      pointer-events:none;
    }
    .env-front{ position:absolute; inset:0; border-radius: var(--radius); overflow:hidden; }
    .pocket{
      position:absolute; left:0; right:0; bottom:0;
      height: 72%;
      background: linear-gradient(180deg, rgba(255,225,234,.98), rgba(255,208,221,.98));
      border-bottom-left-radius: var(--radius);
      border-bottom-right-radius: var(--radius);
    }
    .pocket::before, .pocket::after{
      content:""; position:absolute; top:0; bottom:0; width:50%;
      background: linear-gradient(180deg, rgba(255,232,239,.98), rgba(255,213,225,.98));
      opacity:.95;
    }
    .pocket::before{ left:0; clip-path: polygon(0 0, 100% 55%, 0 100%); }
    .pocket::after{ right:0; clip-path: polygon(100% 0, 0 55%, 100% 100%); }

    .flap{
      position:absolute; left:0; right:0; top:0;
      height: 58%;
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,225,234,.98));
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top;
      transition: transform 900ms cubic-bezier(.2,.8,.2,1);
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.10));
    }

    /* Heart button */
    .seal{
      position:absolute;
      left:50%; top:56%;
      transform: translate(-50%,-50%);
      width:60px; height:60px;  /* slightly bigger */
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, var(--accent));
      box-shadow: 0 12px 22px rgba(255,77,109,.38);
      display:grid; place-items:center;
      color:#fff;
      cursor:pointer;
      transition: transform 200ms ease, opacity 200ms ease;
      z-index:3;
    }
    .seal:active{ transform: translate(-50%,-50%) scale(.96); }
    .seal span{ font-size:20px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }

    /* letter paper */
    .letter{
      position:absolute;
      left:50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(30px);
      width: 86%;
      height: 210px;
      background: var(--paper);
      border-radius: 14px;
      box-shadow: 0 12px 25px rgba(0,0,0,.16);
      transition: transform 950ms cubic-bezier(.2,.85,.2,1), opacity 650ms ease;
      opacity: 0;
      overflow:hidden;
    }
    .letter::before{
      content:"";
      position:absolute; inset:0;
      background:
        linear-gradient(to bottom, rgba(255,77,109,.10), transparent 40%),
        repeating-linear-gradient(to bottom,
          rgba(58,42,42,.08), rgba(58,42,42,.08) 1px,
          transparent 1px, transparent 18px
        );
      pointer-events:none;
      opacity:.65;
    }
    .letter-inner{
      position:relative;
      height:100%;
      padding: 18px 16px;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:10px;
    }
    .title{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
    .title h1{ margin:0; font-size:18px; }
    .date{ font-size:12px; opacity:.65; white-space:nowrap; }
    .msg{ margin:0; font-size:14.5px; line-height:1.65; white-space:pre-line; }

    .actions{
      display:flex; gap:10px;
      align-items:center; justify-content:space-between;
      flex-wrap:wrap;
    }
    button{
      border:0; border-radius:999px;
      padding: 10px 14px;
      font-weight:600;
      cursor:pointer;
      box-shadow: 0 10px 18px rgba(0,0,0,.12);
      transition: transform .12s ease;
      background: linear-gradient(180deg, #fff, #ffe1ea);
      color: var(--ink);
    }
    button:active{ transform: translateY(1px) scale(.99); }
    button.primary{
      background: linear-gradient(180deg, var(--accent), #ff2f57);
      color:#fff;
    }
    .secret{
      display:none;
      width:100%;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,77,109,.10);
      border: 1px dashed rgba(255,77,109,.45);
      font-size: 14px;
      line-height: 1.55;
    }
    .secret.show{ display:block; }
    .sig{ font-size:13px; opacity:.85; }

    .envelope.open .flap{ transform: rotateX(180deg); }
    .envelope.open .letter{
      opacity:1;
      transform: translateX(-50%) translateY(-75px);
    }

    /* modal */
    .modal{
      position:fixed; inset:0;
      display:none;
      background: rgba(0,0,0,.40);
      backdrop-filter: blur(6px);
      z-index:30;
      padding:18px;
    }
    .modal.show{ display:grid; place-items:center; }
    .card{
      width:min(92vw, 520px);
      background: var(--paper);
      border-radius: 22px;
      box-shadow: 0 24px 70px rgba(0,0,0,.28);
      overflow:hidden;
      position:relative;
    }
    .card::before{
      content:"";
      position:absolute; inset:0;
      background: repeating-linear-gradient(to bottom,
        rgba(58,42,42,.07), rgba(58,42,42,.07) 1px,
        transparent 1px, transparent 20px
      );
      opacity:.7;
      pointer-events:none;
    }
    .card-inner{ position:relative; padding:18px 18px 16px; display:grid; gap:12px; }
    .card h2{ margin:0; font-size:18px; }
    .card p{ margin:0; line-height:1.7; font-size:15px; white-space:pre-line; }
    .close-row{ display:flex; justify-content:flex-end; }

    /* hearts canvas */
    canvas#hearts{ position:fixed; inset:0; z-index:12; pointer-events:none; }

    @media (max-width:380px){
      .envelope{ height:240px; width: 92vw; }
      .envelope.open .letter{ transform: translateX(-50%) translateY(-66px); }
      .msg{ font-size:14px; }
    }
    /* ===== HEART ENVELOPE SKIN ===== */
    /* ===== HEART ENVELOPE SKIN ===== */
    .envelope{
    width: 580px;
    height: 640px;
    max-width: 94vw;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    }

    /* tạo 1 lớp trái tim làm vỏ */
    .envelope::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at 30% 25%, #fff, #ffd1dd 35%, #ff9fb4 100%);
    box-shadow: 0 22px 70px rgba(0,0,0,.25);
    clip-path: path("M 280 448 C 120 338 24 256 24 168 C 24 92 86 44 156 44 C 204 44 246 70 280 114 C 314 70 356 44 404 44 C 474 44 536 92 536 168 C 536 256 440 338 280 448 Z");
    transform: translateY(45px);
    }

    /* tắt viền dashed cũ */
    .envelope::after{ display:none; }
    .envelope::before{ border-radius: 0; }

    /* ẩn các phần phong bì chữ nhật cũ */
    /* chỉ ẩn pocket + flap thôi, GIỮ env-front để còn nút tim */
    .pocket, .flap{
    display:none !important;
    }
    .env-front{
    position:absolute;
    inset:0;
    background: transparent;
    }
    /* đặt nút tim lên giữa trái tim */
    .seal{
    left:50%;
    top:48%;
    transform: translate(-50%,-50%);
    width:70px;
    height:70px;
    }

    /* lá thư nằm trong trái tim */
    .letter{
    left:50%;
    top:58%;
    bottom:auto;
    transform: translate(-50%,-50%) scale(.96);
    width: 90%;
    height: 80%;
    border-radius: 18px;
    opacity:0;
    }

    /* mở thư: hiện lên + nhô nhẹ */
    .envelope.open .letter{
    opacity:1;
    transform: translate(-50%,-58%) scale(1);
    }

    .tap-hint.hide{
    opacity: 0;
    transform: translateX(-50%) translateY(-6px);
    pointer-events: none;
    transition: opacity 260ms ease, transform 260ms ease;
    }

  </style>
</head>
<body>

  <div class="stage">
    <div class="layer" id="layerA"></div>
    <div class="layer" id="layerB"></div>
  </div>

  <div class="tap-hint" id="tapHint">
    ❤️ Bấm tim nhiều lần để lấp 16 ảnh quanh màn hình
  </div>

  <!-- 16 slots: top5 + bottom5 + edge(2+2 normal) + near-envelope(2 tall) -->
  <div class="slots" id="slots" aria-hidden="true">
    <!-- TOP 5 -->
    <div class="slot t1"></div>
    <div class="slot t2"></div>
    <div class="slot t3"></div>
    <div class="slot t4"></div>
    <div class="slot t5"></div>

    <!-- EDGE SIDES (normal size) -->
    <div class="slot l1"></div>
    <div class="slot l2"></div>
    <div class="slot r1"></div>
    <div class="slot r2"></div>

    <!-- NEAR ENVELOPE (tall only) -->
    <div class="slot tall lm"></div>
    <div class="slot tall rm"></div>

    <!-- BOTTOM 5 -->
    <div class="slot b1"></div>
    <div class="slot b2"></div>
    <div class="slot b3"></div>
    <div class="slot b4"></div>
    <div class="slot b5"></div>
  </div>

  <canvas id="hearts"></canvas>

  <div class="wrap">
    <div class="envelope locked" id="envelope">
      <div class="env-front">
        <div class="flap"></div>
        <div class="pocket"></div>
        <div class="seal" id="heartBtn"><span>❤</span></div>
      </div>

      <div class="letter" aria-hidden="true">
        <div class="letter-inner">
          <div class="title">
            <h1>Gửi <span id="toName">cậu</span> ✨</h1>
            <div class="date" id="today"></div>
          </div>

          <p class="msg" id="mainMsg"></p>

          <div class="actions">
            <button class="primary" id="revealBtn">Bấm vào đây</button>
            <span class="sig">— từ <span id="fromName">mình</span> 💗</span>
          </div>

          <div class="secret" id="secretBox"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="card">
      <div class="card-inner">
        <div class="close-row"><button id="closeModal">Đóng</button></div>
        <h2 id="modalTitle">💌 Thư của mình</h2>
        <p id="modalBody"></p>
        <div class="actions" style="justify-content:space-between">
          <span class="sig">Happy Valentine ❤️</span>
          <button class="primary" id="copyText">Copy lời chúc</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ========= CUSTOMIZE ========= */
    const PHOTOS = [
      "assets/1.jpg","assets/2.jpg","assets/3.jpg","assets/4.jpg",
      "assets/5.jpg","assets/6.jpg","assets/7.jpg","assets/8.jpg",
      "assets/9.jpg","assets/10.jpg","assets/11.jpg","assets/12.jpg",
      "assets/13.jpg","assets/14.jpg","assets/15.jpg","assets/16.jpg"
    ];

    const CONFIG = {
      toName: "Thảo Nhi iuu",
      fromName: "Heo iu của em",
      mainMessage:
`Gửi người con gái xinhh đẹp nhất trên đời, duy nhất mình em xinh thoiiii.
Hôm nay là 14/02, anh chỉ muốn nói là...
Từ ngày có em, ngày bình thường của anh cũng đều trở thành ngày đặc biệt.
Em cho anh biết sự hạnh phúc là gì, tình yêu là gì. Đây là lần đầu tiên trong cuộc đời anh đón Valentine, lần đầu tiên chuẩn bị 1 cái gì đó cho Valentine.
Cảm ơn em vì đã luôn ở đây bên anh, dù cho anh không hoàn hảo, dù anh vụng về và có chút vô tâm cảm ơn em đã cùng anh đi qua mọi khó khăn.
Cảm ơn em rất nhiều, vì đã luôn động viên, quan tâm và lo lắng cho anh, đã giúp cho anh hoàn thiện từng ngày, luôn cố gắng trưởng thành để có thể hiểu em hơn và yêu em hơn mỗi ngày. 
Anh thương em nhiều lắm. Sẽ mãi luôn luôn yêu thương em, dịu dàng với em, yêu chiều em. Vì em là embe của anh.
Chúc công chúa xinh đẹp của anh có 1 ngày Valentine thật vui vẻ nhaaaa`,

    secretMessage: "Cố lênn nhó, chỉ 4 tháng nữa thuiii anh sẽ về với em liền, sẽ bù đắp cho embe nhenn. Yêu vợ nhìu 🥰🥰🥰",
      modalTitle: "💌 Valentine đầu tiên của tụi mình",
      musicUrl: ""
    };

    /* ========= DOM ========= */
    const $ = (s)=>document.querySelector(s);
    const layerA = $("#layerA");
    const layerB = $("#layerB");
    const tapHint = $("#tapHint");

    const envelope = $("#envelope");
    const heartBtn = $("#heartBtn");
    const revealBtn = $("#revealBtn");
    const secretBox = $("#secretBox");
    const today = $("#today");
    const toName = $("#toName");
    const fromName = $("#fromName");
    const mainMsg = $("#mainMsg");

    const modal = $("#modal");
    const modalTitle = $("#modalTitle");
    const modalBody = $("#modalBody");
    const closeModal = $("#closeModal");
    const copyText = $("#copyText");

    // Fill order = DOM order (16 slots)
    const slots = Array.from(document.querySelectorAll(".slot"));

    /* ========= Content ========= */
    toName.textContent = CONFIG.toName;
    fromName.textContent = CONFIG.fromName;
    mainMsg.textContent = CONFIG.mainMessage.trim();
    secretBox.textContent = CONFIG.secretMessage;
    modalTitle.textContent = CONFIG.modalTitle;
    modalBody.textContent = CONFIG.mainMessage.trim() + "\n\n" + CONFIG.secretMessage;
    today.textContent = new Intl.DateTimeFormat("vi-VN",{year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());

    /* ========= Preload ========= */
    PHOTOS.forEach(src => { const img = new Image(); img.src = src; });

    let showingA = true;
    function setBg(el, url){ el.style.backgroundImage = `url("${url}")`; }
    function setStagePhoto(url){
      const showLayer = showingA ? layerB : layerA;
      const hideLayer = showingA ? layerA : layerB;
      setBg(showLayer, url);
      showLayer.classList.add("show");
      hideLayer.classList.remove("show");
      showingA = !showingA;
    }
    if(PHOTOS.length){ setBg(layerA, PHOTOS[0]); layerA.classList.add("show"); }

    /* ========= Fill slots by clicks ========= */
    let step = 0;
    let unlocked = false;
    const NEED = slots.length; // 16

    function revealNext(){
      if(!PHOTOS.length) return;
      const img = PHOTOS[step % PHOTOS.length];
      const slot = slots[Math.min(step, slots.length-1)];
      slot.style.setProperty("--photo", `url("${img}")`);
      slot.classList.add("show");
      setStagePhoto(img);
      startHeartsBurst(14);
      step++;

      const remaining = Math.max(NEED - step, 0);
      if(step >= NEED && !unlocked){
        unlocked = true;
        envelope.classList.remove("locked");
        tapHint.textContent = "💌 Đủ 16 ảnh rồi! Giờ bấm vào phong thư để mở thư nha";
        startHeartsBurst(22);
      } else if(!unlocked) {
        tapHint.textContent = `❤️ Bấm tim thêm ${remaining} lần nữa…`;
      }
    }

    heartBtn.addEventListener("click", (e)=>{
      e.stopPropagation();
      if(!unlocked) revealNext();
      else {
        const img = PHOTOS[step % PHOTOS.length];
        setStagePhoto(img);
        step++;
        startHeartsBurst(10);
      }
    });

    /* ========= Open envelope ========= */
    let opened = false;
    envelope.addEventListener("click", (e)=>{
      if(e.target && (e.target.id === "heartBtn" || e.target.id === "revealBtn")) return;

      if(!unlocked){
        tapHint.textContent = "❤️ Bấm tim để lấp đầy ảnh trước nha!";
        startHeartsBurst(6);
        return;
      }
      opened = !opened;
      envelope.classList.toggle("open", opened);
      if(opened) startHeartsBurst(14);
    });

    revealBtn.addEventListener("click", (e)=>{
      e.stopPropagation();
      secretBox.classList.toggle("show");
      startHeartsBurst(22);
      openModal();
      if(CONFIG.musicUrl) playMusicOnce();
    });

    /* ========= Modal ========= */
    function openModal(){ modal.classList.add("show"); }
    function hideModal(){ modal.classList.remove("show"); }
    closeModal.addEventListener("click", hideModal);
    modal.addEventListener("click", (e)=>{ if(e.target === modal) hideModal(); });

    copyText.addEventListener("click", async ()=>{
      const text =
`${CONFIG.modalTitle}

Gửi ${CONFIG.toName}

${CONFIG.mainMessage.trim()}

${CONFIG.secretMessage}
— ${CONFIG.fromName}`;
      try{
        await navigator.clipboard.writeText(text);
        copyText.textContent = "Đã copy ✅";
        setTimeout(()=> copyText.textContent = "Copy lời chúc", 1200);
      }catch{
        copyText.textContent = "Copy không được 😅";
        setTimeout(()=> copyText.textContent = "Copy lời chúc", 1200);
      }
    });

    /* ========= Hearts canvas ========= */
    const canvas = document.getElementById("hearts");
    const ctx = canvas.getContext("2d");
    let W, H, raf;
    const hearts = [];
    function resize(){
      W = canvas.width = window.innerWidth * devicePixelRatio;
      H = canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }
    window.addEventListener("resize", resize);
    resize();
    function rand(a,b){ return a + Math.random()*(b-a); }
    function heartPath(x,y,size){
      const s = size;
      ctx.beginPath();
      ctx.moveTo(x, y + s*0.35);
      ctx.bezierCurveTo(x, y, x - s*0.55, y, x - s*0.55, y + s*0.35);
      ctx.bezierCurveTo(x - s*0.55, y + s*0.7, x, y + s*0.9, x, y + s*1.15);
      ctx.bezierCurveTo(x, y + s*0.9, x + s*0.55, y + s*0.7, x + s*0.55, y + s*0.35);
      ctx.bezierCurveTo(x + s*0.55, y, x, y, x, y + s*0.35);
      ctx.closePath();
    }
    function addHeartBurst(n){
      const cx = (window.innerWidth/2) * devicePixelRatio;
      const cy = (window.innerHeight/2) * devicePixelRatio;
      for(let i=0;i<n;i++){
        hearts.push({
          x: cx + rand(-160,160) * devicePixelRatio,
          y: cy + rand(-110,110) * devicePixelRatio,
          vx: rand(-1.3,1.3) * devicePixelRatio,
          vy: rand(-2.6,-0.7) * devicePixelRatio,
          g: rand(0.03,0.06) * devicePixelRatio,
          size: rand(8,16) * devicePixelRatio,
          a: 1,
          r: rand(-0.2,0.2),
          vr: rand(-0.02,0.02),
        });
      }
      if(!raf) animate();
    }
    function animate(){
      raf = requestAnimationFrame(animate);
      ctx.clearRect(0,0,W,H);
      const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#ff4d6d";
      for(let i=hearts.length-1;i>=0;i--){
        const h = hearts[i];
        h.vy += h.g;
        h.x += h.vx;
        h.y += h.vy;
        h.r += h.vr;
        h.a -= 0.008;
        ctx.save();
        ctx.globalAlpha = Math.max(h.a, 0);
        ctx.translate(h.x, h.y);
        ctx.rotate(h.r);
        ctx.translate(-h.x, -h.y);
        ctx.fillStyle = accent;
        heartPath(h.x, h.y, h.size);
        ctx.fill();
        ctx.restore();
        if(h.a <= 0 || h.y > H + 40) hearts.splice(i,1);
      }
      if(hearts.length === 0){ cancelAnimationFrame(raf); raf=null; }
    }
    function startHeartsBurst(n){ addHeartBurst(n); }

    /* optional music */
    let audio;
    let playedOnce = false;
    function playMusicOnce(){
      if(playedOnce) return;
      playedOnce = true;
      audio = new Audio(CONFIG.musicUrl);
      audio.loop = true;
      audio.volume = 0.35;
      audio.play().catch(()=>{});
    }

    setTimeout(()=> startHeartsBurst(8), 500);
  </script>
</body>
</html>
